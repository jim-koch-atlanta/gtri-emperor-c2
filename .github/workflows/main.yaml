name: CMake CI

# Trigger on every push (any branch).
on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # gRPC + Protobuf from apt. Generated code is built fresh in-CI, so any
      # protoc version skew vs local ($HOME/.local protoc v35) is irrelevant —
      # robot.proto uses only long-stable proto3 features.
      - name: Install gRPC + Protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler protobuf-compiler-grpc \
            libprotobuf-dev libgrpc++-dev \
            pkg-config

      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build

      - name: Build project
        run: cmake --build ${{ github.workspace }}/build --parallel

      - name: Run CTest
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure
